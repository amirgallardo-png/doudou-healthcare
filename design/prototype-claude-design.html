<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Doudou Healthcare</title>
<meta name="theme-color" content="#F4F1EB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Atkinson+Hyperlegible+Next:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : mobile d'abord (colonne unique + barre basse) ; ≥1024px : menu latéral · contenu en grille · volet de détail à droite.
   Direction « Clinique douce, pensée pour un chat » — vert soin + roux du pelage sur avoine chaude. */
:root{
  --bg:#F4F1EB; --surface:#FFFEFB; --surface-tint:#E3EEEA; --line:#D5DDD8;
  --ink:#13302D; --ink-muted:#4D6461;
  --soin:#1D6B62; --soin-strong:#0F4A44; --on-soin:#FFFFFF;
  --roux:#E37B3E; --roux-ink:#A34A14; --roux-tint:#FBE6D8;
  --miel:#E2AE45; --miel-ink:#7D5600; --miel-tint:#F8EDD2;
  --on-accent:#13302D;
  --ok:#28703F; --ok-tint:#DDEEDF;
  --urgent:#B3222B; --urgent-tint:#FBE4E2;
  --fur:#E58A4E; --fur-dark:#B9602A; --cream:#FBEBD9; --nose:#D9867A; --eye:#A9B83A;
  --scrim:rgba(19,48,45,.38);
  --shadow-card:0 1px 2px rgba(19,48,45,.06),0 4px 16px rgba(19,48,45,.06);
  --shadow-sheet:0 -8px 32px rgba(19,48,45,.14);
  --font-display:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;
  --r-sm:10px;--r-md:16px;--r-lg:24px;--r-pill:999px;
  --tap:44px;--pad:72px;--nav:72px;--sidebar:256px;--pane:400px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1918; --surface:#152422; --surface-tint:#1D3532; --line:#2A3D3A;
  --ink:#EAF2EF; --ink-muted:#A2B7B3;
  --soin:#62C2B4; --soin-strong:#8ED6CB; --on-soin:#0D1918;
  --roux:#F2955C; --roux-ink:#F4A26F; --roux-tint:#3A2619;
  --miel:#EFC163; --miel-ink:#EFC163; --miel-tint:#352C16;
  --on-accent:#0D1918;
  --ok:#74D093; --ok-tint:#16322A;
  --urgent:#FF7B7B; --urgent-tint:#3A1A1C;
  --fur:#E08A52; --fur-dark:#A85A28; --cream:#F1DFC9; --nose:#D08276; --eye:#C3D24E;
  --scrim:rgba(0,0,0,.6);
  --shadow-card:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.25);
  --shadow-sheet:0 -8px 32px rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1918; --surface:#152422; --surface-tint:#1D3532; --line:#2A3D3A;
  --ink:#EAF2EF; --ink-muted:#A2B7B3;
  --soin:#62C2B4; --soin-strong:#8ED6CB; --on-soin:#0D1918;
  --roux:#F2955C; --roux-ink:#F4A26F; --roux-tint:#3A2619;
  --miel:#EFC163; --miel-ink:#EFC163; --miel-tint:#352C16;
  --on-accent:#0D1918;
  --ok:#74D093; --ok-tint:#16322A;
  --urgent:#FF7B7B; --urgent-tint:#3A1A1C;
  --fur:#E08A52; --fur-dark:#A85A28; --cream:#F1DFC9; --nose:#D08276; --eye:#C3D24E;
  --scrim:rgba(0,0,0,.6);
  --shadow-card:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.25);
  --shadow-sheet:0 -8px 32px rgba(0,0,0,.55);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:26px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;color:var(--ink)}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--soin)}
svg{display:block}
.ico{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:20px;height:20px}
.ico.lg{width:28px;height:28px}
.num,.data{font-family:var(--font-data);font-variant-numeric:tabular-nums;font-weight:500}
.muted{color:var(--ink-muted)}
.small{font-size:16px;line-height:22px}
.label{font-size:14px;line-height:18px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--soin);outline-offset:2px;border-radius:6px}

/* ---------- Coquille ---------- */
.app{display:flex;min-height:100%}
.sidebar{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:var(--s3);padding:10px var(--s4);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar .avatar-btn{width:var(--tap);height:var(--tap);border-radius:50%;background:var(--surface-tint);display:grid;place-items:center;overflow:hidden;flex:none}
.topbar h1{font-size:19px;line-height:24px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 12px 6px 10px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line);font-size:14px;line-height:18px;color:var(--ink-muted);white-space:nowrap}
.sync .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.sync[data-state="pending"] .dot{background:var(--miel);animation:pulse 1.2s infinite}
.sync[data-state="offline"] .dot{background:transparent;border:2px solid var(--ink-muted)}
.sync .ico{width:16px;height:16px}
@keyframes pulse{50%{opacity:.35}}
.topbar .sync .txt-long{display:none}
@media (min-width:430px){.topbar .sync .txt-long{display:inline}.topbar .sync .txt-short{display:none}}

.offline-banner{margin:var(--s2) var(--s4) 0;padding:10px 14px;border-radius:var(--r-md);background:var(--miel-tint);color:var(--ink);display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:22px}
.offline-banner .ico{color:var(--miel-ink)}

#view{flex:1;padding:var(--s2) var(--s4) calc(var(--nav) + env(safe-area-inset-bottom,0px) + var(--s6));outline:none}
.view{display:flex;flex-direction:column;gap:var(--s5);max-width:640px;margin:0 auto;width:100%}

/* Barre basse */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;border-radius:var(--r-md);color:var(--ink-muted);font-size:13px;line-height:16px;font-weight:700;position:relative}
.tab .pill{width:56px;height:32px;border-radius:var(--r-pill);display:grid;place-items:center;transition:background .2s var(--ease),transform .2s var(--ease)}
.tab[aria-current="page"]{color:var(--soin)}
.tab[aria-current="page"] .pill{background:var(--surface-tint)}
.tab:active .pill{transform:scale(.92)}
.tab .badge{position:absolute;top:6px;left:calc(50% + 10px);width:10px;height:10px;border-radius:50%;background:var(--miel);border:2px solid var(--surface)}

/* ---------- Composants ---------- */
.card{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:var(--s5)}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card.tint{background:var(--surface-tint);box-shadow:none}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4)}
.card-h h2,.card-h h3{font-size:19px;line-height:24px;font-weight:600}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3)}
.section-h h2{font-size:19px;line-height:24px;font-weight:600}
.link-btn{color:var(--soin);font-weight:700;font-size:16px;min-height:var(--tap);display:inline-flex;align-items:center;gap:4px;padding:0 4px;border-radius:8px}
.link-btn .ico{width:18px;height:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--r-md);font-weight:700;font-size:17px;transition:transform .12s var(--ease),background .2s,box-shadow .2s;user-select:none;text-align:center}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--soin);color:var(--on-soin)}
.btn.primary:hover{background:var(--soin-strong)}
.btn.secondary{background:var(--surface-tint);color:var(--ink)}
.btn.ghost{border:1.5px solid var(--ink-muted);color:var(--ink)}
.btn.danger{background:var(--urgent);color:var(--surface)}
.btn.block{width:100%}
.btn.sm{min-height:var(--tap);padding:0 14px;font-size:16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:var(--tap);height:var(--tap);display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.icon-btn:hover{background:var(--surface-tint)}
.icon-btn:active{transform:scale(.92)}

.chip{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 16px;border-radius:var(--r-pill);border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;white-space:nowrap;transition:background .15s,border-color .15s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .ico{width:18px;height:18px}
.chips{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--s4) * -1);padding:2px var(--s4)}
.chips::-webkit-scrollbar{display:none}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-tint);border-radius:var(--r-pill);padding:4px;gap:4px}
.seg button{min-height:40px;padding:0 16px;border-radius:var(--r-pill);font-weight:700;font-size:16px;color:var(--ink-muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-card)}

.status{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:var(--r-sm);font-size:14px;line-height:18px;font-weight:700;white-space:nowrap}
.status .ico{width:16px;height:16px;stroke-width:2.2}
.status.ok{background:var(--ok-tint);color:var(--ok)}
.status.watch{background:var(--miel-tint);color:var(--miel-ink);box-shadow:inset 0 0 0 1.5px var(--miel-ink)}
.status.soon{background:var(--roux-tint);color:var(--roux-ink)}
.status.urgent{background:var(--urgent);color:var(--surface)}
.status.neutral{background:var(--surface-tint);color:var(--ink)}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;min-height:56px;text-align:left;width:100%;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .r-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-tint);color:var(--soin)}
.row .r-ico.roux{background:var(--roux-tint);color:var(--roux-ink)}
.row .r-ico.miel{background:var(--miel-tint);color:var(--miel-ink)}
.row .r-ico.ok{background:var(--ok-tint);color:var(--ok)}
.row .r-main{flex:1;min-width:0}
.row .r-title{font-weight:700;line-height:22px}
.row .r-sub{color:var(--ink-muted);font-size:16px;line-height:22px}
.row .r-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px}
.row .r-end{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.row .chev{color:var(--ink-muted)}
button.row:hover .r-title{color:var(--soin)}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .flabel{font-weight:700;font-size:16px}
.input{min-height:48px;padding:10px 14px;border-radius:var(--r-sm);border:1.5px solid var(--ink-muted);background:var(--surface);width:100%}
.input:focus{outline:3px solid var(--soin);outline-offset:1px;border-color:var(--soin)}
textarea.input{min-height:96px;resize:vertical;line-height:24px}
.field .err{color:var(--urgent);font-size:16px;display:flex;gap:6px;align-items:center}
.input[aria-invalid="true"]{border-color:var(--urgent)}

.choice-group{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.choice{min-height:64px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:15px;line-height:18px;padding:6px 4px;transition:all .15s var(--ease)}
.choice[aria-pressed="true"]{border-color:var(--soin);background:var(--surface-tint);color:var(--soin);box-shadow:inset 0 0 0 1.5px var(--soin)}
.choice:active{transform:scale(.96)}

.toggle{position:relative;width:52px;height:32px;border-radius:var(--r-pill);background:var(--line);flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.toggle[aria-checked="true"]{background:var(--soin)}
.toggle[aria-checked="true"]::after{transform:translateX(20px)}

.grid-2,.grid-3,.col{display:flex;flex-direction:column;gap:var(--s5);min-width:0}
/* Toast */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 12px);z-index:80;display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100% - 32px));pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:var(--r-md);font-size:16px;line-height:22px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:toastIn .3s var(--ease);pointer-events:auto}
.toast .ico{width:20px;height:20px;flex:none}
.toast.out{animation:toastOut .25s var(--ease) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}

/* Feuille (mobile) */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:88%;display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--shadow-sheet);transform:translateY(100%);transition:transform .3s var(--ease);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0;flex:none}
.sheet-h{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3) var(--s2) var(--s5);flex:none}
.sheet-h h2{flex:1;font-size:21px;line-height:26px;font-weight:600;min-width:0}
.sheet-b{overflow-y:auto;padding:var(--s2) var(--s5) var(--s6);display:flex;flex-direction:column;gap:var(--s5);overscroll-behavior:contain}

/* Volet détail PC */
.pane{display:none}

/* Squelettes */
.sk{background:linear-gradient(90deg,var(--surface-tint) 0%,var(--line) 50%,var(--surface-tint) 100%);background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:var(--r-md)}
@keyframes sk{to{background-position:-200% 0}}

/* Animations d'entrée */
.rise{animation:rise .42s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.view-enter{animation:viewIn .24s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateX(12px)}}

/* ---------- Aujourd'hui ---------- */
.hero{position:relative;background:var(--surface-tint);border-radius:var(--r-lg);padding:var(--s5) var(--s5) var(--s5);margin-top:18px;overflow:visible}
.hero::before,.hero::after{content:"";position:absolute;top:-16px;width:44px;height:30px;background:var(--surface-tint);clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:6px}
.hero::before{left:28px;transform:rotate(-8deg)}
.hero::after{right:28px;transform:rotate(8deg)}
.hero-top{display:flex;gap:var(--s4);align-items:center}
.hero-cat{width:112px;height:112px;flex:none;margin:-8px 0 -4px -6px}
.hero-txt{min-width:0;flex:1}
.hero-date{font-size:16px;color:var(--ink-muted);line-height:22px}
.hero h2{font-size:30px;line-height:34px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.hero-sum{margin-top:var(--s3);font-size:17px}
.whiskers{display:flex;flex-direction:column;gap:5px;margin:var(--s4) 0 0;opacity:.5}
.whiskers i{display:block;height:1.5px;background:var(--soin);border-radius:2px}
.whiskers i:nth-child(1){width:44%}.whiskers i:nth-child(2){width:36%}.whiskers i:nth-child(3){width:28%}

.eye{display:inline-flex;align-items:center;gap:10px;margin-top:var(--s4);background:var(--surface);padding:6px 14px 6px 6px;border-radius:var(--r-pill);font-weight:700;font-size:16px}
.eye svg{width:34px;height:34px}

/* Coussinets */
.paw-card{display:flex;flex-direction:column;gap:var(--s4)}
.paw-head{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap}
.paw-head h2{font-size:19px;line-height:24px;font-weight:600}
.paw{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);align-items:end;padding:0 var(--s2)}
.toe{display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:var(--r-md);padding:4px 0}
.toe .pad{width:var(--pad);height:calc(var(--pad) + 6px);border-radius:50% 50% 46% 46%;background:var(--roux-tint);display:grid;place-items:center;color:var(--roux-ink);transition:transform .25s var(--ease),background .25s,box-shadow .25s;position:relative}
.toe:nth-child(2) .pad{transform:translateY(-14px)}
.toe:nth-child(2){margin-top:-14px}
.toe[aria-current="step"] .pad{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--roux)}
.toe.done .pad{background:var(--roux);color:var(--on-accent)}
.toe .t-lab{font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted)}
.toe .t-val{font-size:16px;font-weight:700;line-height:20px;min-height:20px}
.toe.lit .pad{animation:lit .5s var(--ease)}
@keyframes lit{40%{transform:scale(1.14)}}
.toe:nth-child(2).lit .pad{animation:lit2 .5s var(--ease)}
@keyframes lit2{0%,100%{transform:translateY(-14px)}40%{transform:translateY(-14px) scale(1.14)}}
.main-pad{margin:0 auto;width:min(240px,80%);min-height:64px;border-radius:44% 44% 50% 50% / 60% 60% 40% 40%;background:var(--roux-tint);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;color:var(--roux-ink);text-align:center;padding:8px 16px;position:relative;font-size:16px;line-height:20px}
.main-pad.done{background:var(--ok-tint);color:var(--ok)}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.opt{min-height:var(--pad);border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:16px;line-height:20px;transition:transform .12s var(--ease),border-color .15s,background .15s}
.opt:hover{border-color:var(--roux)}
.opt:active{transform:scale(.95)}
.opt .ico{width:28px;height:28px;color:var(--roux-ink)}
.opt-q{font-weight:700;text-align:center}
.print-paw{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.print-paw svg{width:120px;height:120px;color:var(--ok);opacity:0}
.stamp .print-paw svg{animation:stamp .9s var(--ease) forwards}
@keyframes stamp{0%{opacity:0;transform:scale(2.2) rotate(-18deg)}35%{opacity:.9;transform:scale(1) rotate(-8deg)}70%{opacity:.9}100%{opacity:0;transform:scale(1) rotate(-8deg)}}

.cat .eyes-open{transform-origin:center 50%;transform-box:fill-box}
.cat.blink .lid{animation:blink 1.6s var(--ease)}
@keyframes blink{0%,100%{transform:scaleY(1)}25%,60%{transform:scaleY(.08)}}
.cat .lid{transform-box:fill-box;transform-origin:center}
.cat.purr{animation:purr .12s linear 10}
@keyframes purr{50%{transform:translateX(.6px)}}
.hearts{position:absolute;pointer-events:none;inset:0}
.heart{position:absolute;width:18px;height:18px;color:var(--roux);animation:heart 1.4s var(--ease) forwards}
@keyframes heart{from{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}to{opacity:0;transform:translateY(-60px) scale(1)}}

.alert-soft{display:flex;gap:var(--s4);align-items:flex-start;background:var(--miel-tint);border-radius:var(--r-md);padding:var(--s5)}
.alert-soft .a-ico{width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--miel-ink);display:grid;place-items:center;flex:none}
.alert-soft h3{font-size:18px;line-height:24px;font-weight:600}
.alert-soft p{margin-top:4px}
.alert-soft .acts{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3)}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.kpi{background:var(--surface);border-radius:var(--r-md);padding:var(--s4);box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.kpi .k-lab{display:flex;align-items:center;gap:6px;color:var(--ink-muted);font-size:16px;line-height:20px}
.kpi .k-lab .ico{width:18px;height:18px}
.kpi .k-val{font-family:var(--font-data);font-size:28px;line-height:32px;font-weight:500;letter-spacing:-.02em}
.kpi .k-val small{font-size:16px;color:var(--ink-muted);margin-left:2px}
.kpi .k-note{font-size:16px;line-height:22px}

/* ---------- Santé ---------- */
.verdict{display:flex;flex-direction:column;gap:var(--s3)}
.verdict h2{font-size:30px;line-height:34px;font-weight:700;letter-spacing:-.02em}
.ind{display:grid;grid-template-columns:1fr;gap:var(--s3)}
.ind-card{display:grid;grid-template-columns:auto 1fr;gap:4px var(--s4);align-items:center;background:var(--surface);border-radius:var(--r-md);padding:var(--s4) var(--s5);box-shadow:var(--shadow-card);text-align:left;width:100%}
.ind-card .i-ico{grid-row:span 3;width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.ind-card .i-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ind-card .i-name{font-weight:700}
.ind-card .i-val{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-data);font-size:24px;line-height:28px;font-weight:500}
.ind-card .i-txt{color:var(--ink-muted);font-size:16px;line-height:22px}
.chart{width:100%;position:relative;min-height:180px}
.chart svg text{font-family:var(--font-data);font-size:13px;fill:var(--ink-muted)}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:14px;line-height:18px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .15s;font-family:var(--font-data)}
.chart .tip.on{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);font-size:16px;line-height:20px;color:var(--ink-muted);margin-top:var(--s3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.meaning{background:var(--surface-tint);border-radius:var(--r-md);padding:var(--s4);display:flex;gap:var(--s3);font-size:16px;line-height:22px;margin-top:var(--s4)}
.meaning .ico{color:var(--soin);flex:none;margin-top:-1px}
.trend-grid{display:grid;grid-template-columns:1fr;gap:var(--s4)}

/* ---------- Dossier ---------- */
.allergy{display:flex;gap:var(--s3);align-items:center;background:var(--roux-tint);color:var(--ink);border-radius:var(--r-md);padding:var(--s3) var(--s4);border:1.5px solid var(--roux-ink)}
.allergy .ico{color:var(--roux-ink)}
.allergy strong{color:var(--roux-ink)}
.visit-cta{display:flex;gap:var(--s4);align-items:center;background:var(--soin);color:var(--on-soin);border-radius:var(--r-md);padding:var(--s4) var(--s5);text-align:left;width:100%;transition:transform .12s var(--ease)}
.visit-cta:active{transform:scale(.98)}
.visit-cta .v-ico{width:48px;height:48px;border-radius:50%;background:color-mix(in srgb,var(--on-soin) 18%,transparent);display:grid;place-items:center;flex:none}
.visit-cta h3{color:var(--on-soin);font-size:18px;line-height:24px}
.visit-cta p{font-size:16px;line-height:22px;opacity:.9}
.tl{display:flex;flex-direction:column;gap:var(--s5)}
.tl-month{display:flex;flex-direction:column;gap:var(--s2)}
.tl-month > h3{font-size:14px;line-height:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);font-family:var(--font-body)}
.rec{display:grid;grid-template-columns:44px 1fr auto;gap:var(--s3);align-items:center;background:var(--surface);border-radius:var(--r-md);padding:var(--s3) var(--s4);box-shadow:var(--shadow-card);text-align:left;width:100%;transition:transform .12s var(--ease)}
.rec:active{transform:scale(.985)}
.rec[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--soin),var(--shadow-card)}
.rec .r-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.rec .r-title{font-weight:700;line-height:22px}
.rec .r-sub{color:var(--ink-muted);font-size:16px;line-height:22px}
.t-consult{background:var(--surface-tint);color:var(--soin)}
.t-vaccin{background:var(--ok-tint);color:var(--ok)}
.t-traitement{background:var(--roux-tint);color:var(--roux-ink)}
.t-analyse{background:var(--miel-tint);color:var(--miel-ink)}
.t-ordonnance{background:var(--surface-tint);color:var(--ink)}
.vax-cal{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px 4px;margin-top:var(--s2)}
@media (min-width:600px){.vax-cal{grid-template-columns:repeat(12,minmax(0,1fr))}}
.vax-cal .m{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;line-height:16px;color:var(--ink-muted);font-family:var(--font-data)}
.vax-cal .m b{width:100%;height:36px;border-radius:8px;background:var(--surface-tint);display:grid;place-items:center}
.vax-cal .m.now b{box-shadow:inset 0 0 0 2px var(--ink-muted)}
.vax-cal .m.has b{background:var(--ok);color:var(--surface)}
.vax-cal .m.has.next b{background:var(--miel);color:var(--on-accent)}
.vax-cal .m b .ico{width:18px;height:18px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:10px var(--s4);font-size:16px;line-height:22px}
.dl dt{color:var(--ink-muted)}
.dl dd{margin:0;font-weight:700;min-width:0}
.explain{background:var(--surface-tint);border-radius:var(--r-md);padding:var(--s4)}
.explain h4{font-size:16px;line-height:22px;margin-bottom:4px;display:flex;gap:8px;align-items:center}

/* Résumé de visite */
.visit{position:fixed;inset:0;z-index:90;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px 32px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.visit-doc{background:var(--surface);color:var(--ink);width:min(720px,100%);border-radius:var(--r-lg);padding:var(--s6) var(--s5);box-shadow:var(--shadow-sheet);display:flex;flex-direction:column;gap:var(--s5);animation:rise .35s var(--ease)}
.visit-bar{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;justify-content:space-between}
.visit-doc h2{font-size:26px;line-height:32px}
.visit-doc h3{font-size:17px;line-height:22px;margin-bottom:6px}
.visit-grid{display:grid;grid-template-columns:1fr;gap:var(--s4)}
.visit-doc .box{border:1.5px solid var(--line);border-radius:var(--r-md);padding:var(--s4)}
.visit-doc ul{margin:0;padding-left:20px}
.visit-doc li{margin:2px 0}
.q-item{display:flex;gap:8px;align-items:center}
.q-item input{flex:1;min-width:0}

/* ---------- Journal ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:13px;font-weight:700;text-align:center;color:var(--ink-muted);letter-spacing:.04em;padding-bottom:2px}
.day{aspect-ratio:1;min-height:var(--tap);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--font-data);font-size:15px;line-height:16px;background:var(--surface);position:relative;max-width:100%}
.day .g{width:12px;height:12px;display:block}
.day.empty{background:transparent}
.day.future{color:var(--ink-muted);opacity:.55}
.day.none{background:var(--surface);color:var(--ink-muted)}
.day.bonne{background:var(--ok-tint)}
.day.moyenne{background:var(--miel-tint)}
.day.difficile{background:var(--roux-tint)}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day[aria-current="true"]{box-shadow:inset 0 0 0 3px var(--soin)}
.day .cam{position:absolute;top:3px;right:4px;width:12px;height:12px;color:var(--ink-muted)}
.cal-legend{display:flex;gap:var(--s4);flex-wrap:wrap;font-size:16px;color:var(--ink-muted)}
.cal-legend span{display:inline-flex;gap:6px;align-items:center}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.photo{aspect-ratio:1;border-radius:var(--r-sm);overflow:hidden;background:var(--surface-tint);max-width:100%}
.photo img,.photo svg{width:100%;height:100%;object-fit:cover}
.photo-add{aspect-ratio:1;border-radius:var(--r-sm);border:2px dashed var(--ink-muted);display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;color:var(--ink-muted);font-size:14px;font-weight:700;cursor:pointer}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px}
.entry-slot{display:flex;flex-direction:column;gap:var(--s2)}
.entry-line{display:flex;align-items:center;gap:10px;font-size:16px}
.entry-line .ico{color:var(--roux-ink);width:20px;height:20px}

/* ---------- Alimentation ---------- */
.meal{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s3);align-items:center}
.meal-time{font-family:var(--font-data);font-size:16px;color:var(--ink-muted);width:52px}
.bowl-meter{height:10px;border-radius:5px;background:var(--surface-tint);overflow:hidden;margin-top:6px}
.bowl-meter i{display:block;height:100%;background:var(--roux);border-radius:5px}
.transition{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:var(--s3)}
.transition div{display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:18px;color:var(--ink-muted)}
.transition .bar{height:28px;border-radius:8px;overflow:hidden;display:flex;background:var(--surface-tint)}
.transition .bar i{background:var(--soin);display:block}
.transition .bar s{background:var(--roux-tint);display:block;text-decoration:none}
.brand-card{display:flex;gap:var(--s4);align-items:center}
.pack{width:52px;height:64px;flex:none;border-radius:10px 10px 6px 6px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--on-soin);background:var(--soin);position:relative}
.pack.roux{background:var(--roux);color:var(--on-accent)}

/* ---------- Activité ---------- */
.ring-wrap{display:flex;gap:var(--s5);align-items:center}
.ring{width:132px;height:132px;flex:none;position:relative}
.ring .r-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .r-in b{font-family:var(--font-data);font-size:30px;line-height:32px;font-weight:500}
.map{position:relative;border-radius:var(--r-md);overflow:hidden;background:var(--surface-tint)}
.map svg{width:100%;height:auto}
.map-card{position:absolute;left:12px;right:12px;bottom:12px;background:var(--surface);border-radius:var(--r-md);padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow-card)}
.map-card .r-main{flex:1;min-width:0}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s var(--ease) infinite}
@keyframes ping{from{transform:scale(.6);opacity:.7}to{transform:scale(2.4);opacity:0}}
.well{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.well div{background:var(--surface-tint);border-radius:var(--r-md);padding:var(--s3);display:flex;flex-direction:column;gap:2px;min-width:0}
.well b{font-family:var(--font-data);font-size:20px;font-weight:500}

/* ---------- Finances ---------- */
.total{display:flex;flex-direction:column;gap:4px}
.total .big{font-family:var(--font-data);font-size:44px;line-height:48px;font-weight:500;letter-spacing:-.03em}
.stackbar{display:flex;height:20px;border-radius:10px;overflow:hidden;gap:2px;margin:var(--s3) 0}
.stackbar i{display:block;height:100%}
.cat-list .row .sw{width:14px;height:14px;border-radius:4px;flex:none}

/* ---------- Dr. Doudou ---------- */
.chat{display:flex;flex-direction:column;gap:var(--s4);min-height:0}
.chat-intro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s3);padding:var(--s4) 0}
.chat-intro .doc{width:96px;height:96px}
.chat-intro h2{font-size:26px;line-height:30px}
.disclaimer{display:flex;gap:8px;align-items:flex-start;font-size:16px;line-height:22px;color:var(--ink-muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px}
.disclaimer .ico{width:20px;height:20px;flex:none;margin-top:1px}
.suggest{display:flex;flex-direction:column;gap:var(--s2);width:100%}
.suggest button{text-align:left;padding:12px 16px;min-height:var(--tap);border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:16px;line-height:22px;display:flex;gap:10px;align-items:center}
.suggest button:hover{border-color:var(--soin)}
.suggest button .ico{color:var(--soin);width:20px;height:20px}
.msgs{display:flex;flex-direction:column;gap:var(--s4)}
.msg{display:flex;flex-direction:column;gap:var(--s2);max-width:92%}
.msg.user{align-self:flex-end;background:var(--soin);color:var(--on-soin);padding:10px 16px;border-radius:var(--r-md) var(--r-md) 6px var(--r-md);font-weight:700}
.msg.bot{align-self:flex-start;width:100%;max-width:100%}
.bubble{background:var(--surface);border-radius:6px var(--r-md) var(--r-md) var(--r-md);padding:var(--s4);box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:var(--s3)}
.bubble p+p{margin-top:0}
.bubble ul{margin:0;padding-left:20px}
.bubble .ctx{display:flex;gap:8px;align-items:flex-start;background:var(--surface-tint);border-radius:var(--r-sm);padding:8px 12px;font-size:16px;line-height:22px}
.bubble .ctx .ico{width:18px;height:18px;color:var(--soin);flex:none;margin-top:2px}
.bot-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.bot-h svg.av{width:32px;height:32px}
.sources{display:flex;flex-wrap:wrap;gap:6px}
.src{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 12px;border-radius:var(--r-pill);background:var(--surface-tint);font-size:14px;line-height:18px;font-weight:700;color:var(--ink);text-decoration:none;border:1px solid var(--line)}
.src:hover{border-color:var(--soin);color:var(--soin)}
.src .ico{width:14px;height:14px}
.src-lab{font-size:14px;line-height:18px;color:var(--ink-muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.fine{font-size:14px;line-height:18px;color:var(--ink-muted);display:flex;gap:6px;align-items:center}
.typing{display:inline-flex;gap:5px;padding:6px 2px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--ink-muted);animation:typ 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes typ{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.caret{display:inline-block;width:2px;height:18px;background:var(--soin);vertical-align:-3px;margin-left:2px;animation:pulse .8s infinite}
.urgent-band{display:flex;flex-direction:column;gap:var(--s3);background:var(--urgent-tint);border:2px solid var(--urgent);border-radius:var(--r-md);padding:var(--s4)}
.urgent-band h4{color:var(--urgent);font-size:18px;line-height:24px;display:flex;gap:8px;align-items:center}
.callbox{display:flex;flex-direction:column;gap:6px;background:var(--surface);border-radius:var(--r-sm);padding:10px 12px}
.callbox .numb{font-family:var(--font-data);font-size:20px;user-select:all}
.err-bubble{display:flex;flex-direction:column;gap:var(--s3);background:var(--surface);border:1.5px dashed var(--ink-muted);border-radius:var(--r-md);padding:var(--s4)}
.composer{position:sticky;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:var(--s2);align-items:flex-end;background:var(--surface);border-radius:var(--r-lg);padding:6px 6px 6px 16px;box-shadow:var(--shadow-sheet);border:1px solid var(--line);margin-top:var(--s2)}
.composer textarea{flex:1;border:0;background:transparent;resize:none;min-height:44px;max-height:120px;padding:10px 0;line-height:24px;outline:none;min-width:0}
.composer .send{width:44px;height:44px;border-radius:50%;background:var(--soin);color:var(--on-soin);display:grid;place-items:center;flex:none}
.composer .send[disabled]{opacity:.4}
.composer:focus-within{box-shadow:0 0 0 3px var(--soin),var(--shadow-sheet)}

/* ---------- Profil ---------- */
.idcard{position:relative;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:var(--s5);margin-top:18px;display:flex;flex-direction:column;gap:var(--s4)}
.idcard::before,.idcard::after{content:"";position:absolute;top:-16px;width:44px;height:30px;background:var(--surface);clip-path:polygon(50% 0,100% 100%,0 100%)}
.idcard::before{left:28px;transform:rotate(-8deg)}.idcard::after{right:28px;transform:rotate(8deg)}
.id-top{display:flex;gap:var(--s4);align-items:center}
.id-photo{width:96px;height:96px;border-radius:24px;background:var(--surface-tint);flex:none;overflow:hidden}
.id-top h2{font-size:30px;line-height:34px}
.qr-wrap{display:flex;gap:var(--s5);align-items:center;flex-wrap:wrap}
.qr{width:168px;height:168px;padding:10px;background:#FFFFFF;border-radius:var(--r-md);flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.qr svg{width:100%;height:100%}

/* ---------- Réglages ---------- */
.set-row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;min-height:60px;border-top:1px solid var(--line);width:100%;text-align:left}
.set-row:first-child{border-top:0}
.set-row .r-main{flex:1;min-width:0}
.radio-list{display:flex;flex-direction:column;gap:var(--s2)}
.radio{display:flex;gap:var(--s3);align-items:center;padding:var(--s3) var(--s4);border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%;min-height:56px}
.radio .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink-muted);flex:none;display:grid;place-items:center}
.radio[aria-checked="true"]{border-color:var(--soin)}
.radio[aria-checked="true"] .rd{border-color:var(--soin)}
.radio[aria-checked="true"] .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--soin)}
.batt{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-data);font-size:14px}
pre.json{background:var(--surface-tint);border-radius:var(--r-md);padding:var(--s4);font-family:var(--font-data);font-size:13px;line-height:18px;overflow:auto;max-height:300px;margin:0;white-space:pre}

/* États vides */
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s3);padding:var(--s6) var(--s4);background:var(--surface);border-radius:var(--r-lg);border:1.5px dashed var(--line)}
.empty-state svg.ill{width:132px;height:110px}
.empty-state h3{font-size:20px;line-height:26px}
.empty-state p{color:var(--ink-muted);max-width:34ch}

/* Menu Plus */
.more-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s3)}
.more-item{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s2);padding:var(--s4);border-radius:var(--r-md);background:var(--bg);text-align:left;min-height:96px;transition:transform .12s}
.more-item:active{transform:scale(.97)}
.more-item .m-ico{width:44px;height:44px;border-radius:12px;background:var(--surface-tint);color:var(--soin);display:grid;place-items:center}
.more-item b{line-height:22px}
.more-item span{font-size:15px;line-height:20px;color:var(--ink-muted)}

/* ================= PC ≥ 1024px ================= */
@media (min-width:1024px){
  .tabbar{display:none}
  .toasts{bottom:24px}
  .sidebar{display:flex;flex-direction:column;gap:var(--s4);width:var(--sidebar);flex:none;position:sticky;top:0;height:100vh;padding:var(--s5) var(--s4);border-right:1px solid var(--line);background:var(--surface);overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:0 var(--s2)}
  .brand svg{width:40px;height:40px}
  .brand b{font-family:var(--font-display);font-size:20px;line-height:22px;display:block}
  .brand span{font-size:14px;color:var(--ink-muted);line-height:18px}
  .side-cat{display:flex;gap:var(--s3);align-items:center;background:var(--surface-tint);border-radius:var(--r-md);padding:var(--s3);text-align:left;width:100%}
  .side-cat .av{width:48px;height:48px;border-radius:14px;background:var(--surface);overflow:hidden;flex:none}
  .side-cat b{display:block;line-height:22px}
  .side-cat span{font-size:15px;color:var(--ink-muted);line-height:20px}
  .nav-group{display:flex;flex-direction:column;gap:2px}
  .nav-group h3{font-family:var(--font-body);font-size:13px;line-height:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);padding:var(--s2) var(--s3) 4px}
  .nav-item{display:flex;align-items:center;gap:var(--s3);min-height:var(--tap);padding:0 var(--s3);border-radius:12px;font-weight:700;font-size:16px;color:var(--ink-muted);text-align:left;width:100%;transition:background .15s,color .15s}
  .nav-item:hover{background:var(--bg);color:var(--ink)}
  .nav-item[aria-current="page"]{background:var(--surface-tint);color:var(--soin)}
  .nav-item .dotw{margin-left:auto;width:10px;height:10px;border-radius:50%;background:var(--miel)}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:var(--s2)}
  .side-foot .sync{justify-content:flex-start}
  .topbar{padding:var(--s5) var(--s6) var(--s3);background:var(--bg)}
  .topbar .avatar-btn{display:none}
  .topbar h1{font-size:15px;font-weight:700;color:var(--ink-muted);letter-spacing:.04em;text-transform:uppercase;font-family:var(--font-body)}
  .topbar .sync{display:none}
  .offline-banner{margin:var(--s2) var(--s7) 0}
  #view{padding:var(--s2) var(--s6) var(--s7)}
  .view{max-width:1100px;margin:0}
  .composer{bottom:var(--s4)}
  :root{--pane:360px}
  .pane{display:flex;flex-direction:column;width:var(--pane);flex:none;position:sticky;top:0;height:100vh;border-left:1px solid var(--line);background:var(--surface);overflow:hidden}
  .pane-h{display:flex;align-items:center;gap:var(--s3);padding:var(--s5) var(--s4) var(--s3) var(--s5);border-bottom:1px solid var(--line)}
  .pane-h h2{flex:1;font-size:19px;line-height:24px;font-weight:600;min-width:0}
  .pane-b{flex:1;overflow-y:auto;padding:var(--s5);display:flex;flex-direction:column;gap:var(--s5)}
  .pane-b .composer{position:sticky;bottom:0}
  .pane .chat .msg.bot .bubble{box-shadow:none;background:var(--bg)}
  .grid-2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:var(--s5);align-items:start}
  .grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s5);align-items:start}
  .col{display:flex;flex-direction:column;gap:var(--s5);min-width:0}
  .ind{grid-template-columns:repeat(3,1fr)}
  .ind-card{grid-template-columns:1fr;align-content:start}
  .ind-card .i-ico{grid-row:auto}
  .trend-grid{grid-template-columns:1fr 1fr}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .visit-grid{grid-template-columns:1fr 1fr}
  .more-btn-mobile{display:none}
  .hide-desk{display:none!important}
}
@media (max-width:1023.98px){.hide-mob{display:none!important}}
@media (min-width:1024px) and (max-width:1279px){
  :root{--pane:340px;--sidebar:232px}
  #view{padding-left:var(--s5);padding-right:var(--s5)}
  .topbar{padding-left:var(--s5);padding-right:var(--s5)}
  .grid-2{grid-template-columns:minmax(0,1fr)}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
:root.calm *,:root.calm *::before,:root.calm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}

@media print{
  body *{visibility:hidden}
  .visit,.visit *{visibility:visible}
  .visit{position:absolute;inset:0;background:#fff;padding:0;overflow:visible}
  .visit-doc{box-shadow:none;width:100%;color:#000;background:#fff}
  .visit-bar,.no-print{display:none!important}
}

function calHTML() {
  const [y, m] = S.calMonth, first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate();

  let cells = ["L", "M", "M", "J", "V", "S", "D"].map((d, i) => `<div class="dow" aria-hidden="true">${d}</div>`).join("");
  for (let i = 0; i < off; i++) cells += `<div class="day empty" aria-hidden="true"></div>`;
  for (let d = 1; d <= days; d++) {
    const dt = new Date(y, m, d), k = key(dt), l = S.empty ? null : LOGS[k], o = dayOverall(l), fut = dt > TODAY;
    const lab = `${d} ${MOIS[m]}${o ? ", " + DAYWORD[o] : fut ? "" : ", pas de saisie"}${l && l.photos && l.photos.length ? ", avec photo" : ""}`;
    cells += fut ? `<div class="day future" aria-hidden="true">${d}</div>` :

  }

    LOGS[d.k][d.slot] = { h: d.h, a: d.a, s: d.s, vomi: d.vomi === "oui" };
    LOGS[d.k].note = $("#fNote").value.trim(); LOGS[d.k].photos = S.draftPhotos.slice();
    if (wRaw) LOGS[d.k].w = +wRaw;
    S.selDay = d.k; S.empty = false;
    closeSheet(); toast("Journée enregistrée", "pawfill"); markPending(); render(false); return;
  }
  if (f.id === "expForm") {
    const amt = $("#eAmt").value.trim().replace(",", "."), lab = $("#eLabel").value.trim() || "Dépense vétérinaire";
    if (!amt || isNaN(+amt) || +amt <= 0) { const er = $("#eErr"); er.hidden = false; er.innerHTML = ico("alert", "sm") + "Indique un montant en euros, par exemple 45."; $("#eAmt").setAttribute("aria-invalid", "true"); $("#eAmt").focus(); return; }
    EXPENSES.push({ d: $("#eDate").value || key(TODAY), label: lab, cat: $("#eCat").value, amt: Math.round(+amt * 100) / 100 });
    closeSheet(); toast("Dépense ajoutée : " + fmtEur(+amt)); markPending(); render(false);
  }
});
document.addEventListener("input", e => {
  if (e.target.matches(".composer textarea")) autoGrow(e.target);
  if (e.target.dataset.vq != null) S.visitQs[+e.target.dataset.vq] = e.target.value;
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if ($("#visitSlot").innerHTML) { $("#visitSlot").innerHTML = ""; return; } closeSheet(); }
  if (e.key === "Enter" && !e.shiftKey && e.target.matches(".composer textarea")) { e.preventDefault(); e.target.closest("form").requestSubmit(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".photo-add")) { e.preventDefault(); $("#photoInput").click(); }
});
$("#photoInput").addEventListener("change", e => {
  const file = e.target.files[0]; if (!file) return;
  if (!file.type.startsWith("image/")) { toast("Ce fichier n'est pas une image", "alert"); return; }
  const r = new FileReader();
  r.onload = () => { S.draftPhotos.push(r.result); const box = $("#fPhotos"); if (box) box.innerHTML = photosHTML(S.draftPhotos) + `<label class="photo-add" for="photoInput" tabindex="0" data-act="addPhoto">${ico("camera")}Ajouter</label>`; toast("Photo ajoutée", "camera"); };
  r.onerror = () => toast("La photo n'a pas pu être lue. Essaie une autre image.", "alert");
  r.readAsDataURL(file); e.target.value = "";
});
async function copyText(txt, msg) {
  try { await navigator.clipboard.writeText(txt); toast(msg, "copy"); }
  catch (er) {
    const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (x) {}
    ta.remove(); toast(ok ? msg : "Copie impossible ici : sélectionne le texte et copie-le à la main", ok ? "copy" : "alert");
  }
}
$("#scrim").addEventListener("click", closeSheet);
$("#sheetClose").addEventListener("click", closeSheet);
$("#paneClose").addEventListener("click", closePane);
$("#dockChat").addEventListener("click", () => { S.chatPinned = true; renderAside(); setTimeout(() => $("#composer-pane")?.focus(), 50); });
$("#moreTab").addEventListener("click", () => {
  const items = [["journal", "Journal", "Calendrier, notes, photos"], ["alimentation", "Alimentation", "Repas, marques, poids"], ["activite", "Activité et GPS", "Jeu, sommeil, position"], ["finances", "Finances", "Dépenses vétérinaires"], ["profil", "Profil", "Identité, carte de secours"], ["reglages", "Réglages", "Synchro, données, thème"]];
  openDetail("Plus", `<div class="more-grid">${items.map(([k, t, s]) => `<button class="more-item" data-go="${k}"><span class="m-ico">${ico(ROUTES[k].i)}</span><b>${t}</b><span>${s}</span></button>`).join("")}</div>
    <button class="sync" data-go="reglages" data-state="${S.sync}" style="align-self:flex-start"><span class="dot"></span>${syncLabel().l}</button>`, { sheet: true });
});
/* glisser la feuille vers le bas pour la fermer */
(() => { let y0 = null; const sh = $("#sheet");
  sh.addEventListener("touchstart", e => { if (e.target.closest(".sheet-b") && $("#sheetBody").scrollTop > 0) return; y0 = e.touches[0].clientY; }, { passive: true });
  sh.addEventListener("touchmove", e => { if (y0 == null) return; const dy = e.touches[0].clientY - y0; if (dy > 0) sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
  sh.addEventListener("touchend", e => { if (y0 == null) return; const dy = e.changedTouches[0].clientY - y0; sh.style.transform = ""; y0 = null; if (dy > 110) closeSheet(); });
})();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);
let wasDesk = isDesk();
window.addEventListener("resize", () => { const d = isDesk(); if (d !== wasDesk) { wasDesk = d; closeSheet(); render(false); } });

/* ---------- Démarrage ---------- */
applyTheme();
buildSideNav();
renderSync();
const h0 = (location.hash || "").replace("#", "");
S.route = ROUTES[h0] ? h0 : "aujourdhui";
render(true);
window.addEventListener("hashchange", () => { const h = location.hash.replace("#", ""); if (ROUTES[h] && h !== S.route) go(h); });
</script>
